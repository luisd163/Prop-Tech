spring.application.name=Prop-Tech

server.port=8082

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

logging.file.name=logs/app.log
logging.level.root=INFO

# --- Asistente LLM (OpenAI u Ollama compatible) ---
# OpenAI: export OPENAI_API_KEY=sk-...  o define proptech.llm.api-key
# Ollama local: proptech.llm.provider=ollama, base-url=http://localhost:11434/v1, model=llama3.2
proptech.llm.enabled=true
proptech.llm.provider=openai
proptech.llm.api-key=${OPENAI_API_KEY:}
proptech.llm.base-url=https://api.openai.com/v1
proptech.llm.model=gpt-4o-mini