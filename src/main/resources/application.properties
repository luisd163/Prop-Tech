spring.application.name=Prop-Tech

server.port=8082

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

logging.file.name=logs/app.log
logging.level.root=INFO

# --- Asistente LLM (configuración pública; la API key va en application-local.properties) ---
proptech.llm.enabled=true
proptech.llm.provider=openai
proptech.llm.base-url=https://api.openai.com/v1
proptech.llm.model=gpt-4o-mini
proptech.llm.max-tokens=600

# Carga secretos al final (application-local.properties)
spring.config.import=optional:classpath:application-local.properties
