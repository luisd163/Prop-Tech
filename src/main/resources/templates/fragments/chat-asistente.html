<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="chatWidget">
    <style>
        #chat-toggle {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 9998;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(246, 194, 62, 0.5);
            background: linear-gradient(135deg, #16335d, #0b1f3d);
            color: #f6c23e;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        #chat-toggle.offline { border-color: rgba(224, 92, 92, 0.5); color: #e88; }
        #chat-panel {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 22px;
            z-index: 9999;
            width: min(380px, calc(100vw - 32px));
            height: 480px;
            background: #10284a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }
        #chat-panel.open { display: flex; }
        .chat-head {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: #0a1e38;
        }
        .chat-head h6 { margin: 0; color: #f6c23e; font-size: 0.95rem; }
        .chat-head small { color: #7f96b8; display: block; margin-top: 2px; }
        #chat-status { font-size: 0.72rem; color: #5a7a9e; margin-top: 4px; }
        #chat-status.ok { color: #2ecc8f; }
        #chat-status.warn { color: #f6c23e; }
        #chat-status.err { color: #e88; }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-bubble {
            max-width: 88%;
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 0.84rem;
            line-height: 1.45;
            white-space: pre-wrap;
        }
        .chat-bubble.user {
            align-self: flex-end;
            background: rgba(246, 194, 62, 0.15);
            border: 1px solid rgba(246, 194, 62, 0.35);
            color: #f6e6b8;
        }
        .chat-bubble.bot {
            align-self: flex-start;
            background: rgba(75, 141, 232, 0.12);
            border: 1px solid rgba(75, 141, 232, 0.25);
            color: #dbe7f8;
        }
        .chat-bubble.error {
            align-self: flex-start;
            background: rgba(224, 92, 92, 0.12);
            border: 1px solid rgba(224, 92, 92, 0.3);
            color: #f0b0b0;
        }
        .chat-bubble.loading {
            align-self: flex-start;
            color: #7f96b8;
            font-style: italic;
        }
        #chat-form {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: #0a1e38;
        }
        #chat-input {
            flex: 1;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #071429;
            color: #e8eef7;
            padding: 8px 10px;
            font-size: 0.85rem;
            resize: none;
            min-height: 38px;
            max-height: 80px;
        }
        #chat-input:disabled { opacity: 0.5; }
        #chat-send {
            border: none;
            border-radius: 8px;
            background: rgba(246, 194, 62, 0.2);
            color: #f6c23e;
            padding: 0 14px;
            font-weight: 700;
            cursor: pointer;
        }
        #chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>

    <button type="button" id="chat-toggle" title="Asistente PropTech" aria-label="Abrir chat">
        <i class="bi bi-chat-dots-fill"></i>
    </button>

    <div id="chat-panel" role="dialog" aria-label="Asistente PropTech">
        <div class="chat-head">
            <h6><i class="bi bi-robot"></i> Asistente PropTech</h6>
            <small>IA con datos reales de tu perfil, favoritos e inmuebles</small>
            <div id="chat-status">Comprobando configuración…</div>
        </div>
        <div id="chat-messages"></div>
        <form id="chat-form">
            <textarea id="chat-input" rows="1" placeholder="Pregunta por inmuebles, visitas, zonas..."
                      maxlength="800" disabled></textarea>
            <button type="submit" id="chat-send" disabled>Enviar</button>
        </form>
    </div>

    <script>
    (function() {
        const panel = document.getElementById('chat-panel');
        const toggle = document.getElementById('chat-toggle');
        const messagesEl = document.getElementById('chat-messages');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send');
        const statusEl = document.getElementById('chat-status');
        const historial = [];
        let chatListo = false;
        let loadingBubble = null;

        if (!panel || !toggle) return;

        function agregarBubble(texto, tipo) {
            const div = document.createElement('div');
            div.className = 'chat-bubble ' + tipo;
            div.textContent = texto;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function quitarLoading() {
            if (loadingBubble && loadingBubble.parentNode) {
                loadingBubble.remove();
            }
            loadingBubble = null;
        }

        function setChatActivo(activo) {
            chatListo = activo;
            input.disabled = !activo;
            sendBtn.disabled = !activo;
            if (activo) {
                input.placeholder = 'Pregunta por inmuebles, visitas, zonas...';
            }
        }

        async function cargarEstado() {
            try {
                const res = await fetch('/api/chat/estado');
                const data = await res.json();

                if (data.disponible) {
                    statusEl.textContent = 'Conectado · ' + (data.model || data.provider);
                    statusEl.className = 'ok';
                    toggle.classList.remove('offline');
                    setChatActivo(true);
                    if (messagesEl.children.length === 0) {
                        agregarBubble(
                            'Hola, soy tu asistente PropTech. Puedo ayudarte con inmuebles, '
                            + 'favoritos, visitas y zonas según tu perfil. ¿En qué te ayudo?',
                            'bot'
                        );
                    }
                } else if (data.configurado && !data.sesionCliente) {
                    statusEl.textContent = 'Inicia sesión como cliente';
                    statusEl.className = 'warn';
                    toggle.classList.add('offline');
                    setChatActivo(false);
                    agregarBubble('Inicia sesión para usar el asistente.', 'error');
                } else {
                    statusEl.textContent = 'Sin configurar';
                    statusEl.className = 'err';
                    toggle.classList.add('offline');
                    setChatActivo(false);
                    agregarBubble(data.ayuda || 'Configura el asistente LLM en application-local.properties', 'error');
                }
            } catch (e) {
                statusEl.textContent = 'Error al verificar estado';
                statusEl.className = 'err';
                setChatActivo(false);
            }
        }

        toggle.addEventListener('click', function() {
            panel.classList.toggle('open');
            if (panel.classList.contains('open') && messagesEl.children.length === 0) {
                cargarEstado();
            }
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!chatListo) return;

            const texto = input.value.trim();
            if (!texto) return;

            agregarBubble(texto, 'user');
            input.value = '';
            sendBtn.disabled = true;
            input.disabled = true;
            loadingBubble = agregarBubble('Pensando…', 'loading');

            try {
                const res = await fetch('/api/chat/mensaje', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: texto, historial: historial })
                });
                const data = await res.json();
                quitarLoading();

                if (data.exito) {
                    agregarBubble(data.respuesta, 'bot');
                    historial.push({ role: 'user', content: texto });
                    historial.push({ role: 'assistant', content: data.respuesta });
                    if (historial.length > 12) {
                        historial.splice(0, historial.length - 12);
                    }
                } else {
                    agregarBubble(data.error || 'Error desconocido', 'error');
                }
            } catch (err) {
                quitarLoading();
                agregarBubble('Error de conexión con el asistente.', 'error');
            } finally {
                if (chatListo) {
                    sendBtn.disabled = false;
                    input.disabled = false;
                    input.focus();
                }
            }
        });

        cargarEstado();
    })();
    </script>
</th:block>
</body>
</html>
